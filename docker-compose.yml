# Local PostgreSQL for the CytoHub CEO Command Center.
# Matches DATABASE_URL in .env.example.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cytohub
      POSTGRES_PASSWORD: cytohub
      POSTGRES_DB: cytohub_ceo
    ports:
      - "5432:5432"
    volumes:
      - cytohub-ceo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cytohub -d cytohub_ceo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cytohub-ceo-data:
